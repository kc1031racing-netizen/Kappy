    # 手動強寫數值進去
    SET_GCODE_VARIABLE MACRO=_BLTOUCH_MONITOR VARIABLE=last_retry_count VALUE=5
    SET_GCODE_VARIABLE MACRO=_BLTOUCH_MONITOR VARIABLE=is_first_point VALUE=0
    SET_GCODE_VARIABLE MACRO=_BLTOUCH_MONITOR VARIABLE=last_z VALUE=1.23
    
    # 立刻印出來檢查
    M118 測試寫入：Last Retry={printer["gcode_macro _BLTOUCH_MONITOR"].last_retry_count}

#####################################################################
[gcode_macro Apply_adjustment_greaseE]
description: Kappy 重組調整XYZ軸油脂 - 115x115 絕對安全完美修正版
gcode:
    # ----------------------------------------------------
    # 【1. 環境清空與座標安全重置】
    # ----------------------------------------------------
    M117 重置座標系統...
    BED_MESH_CLEAR            # 清除床面補償，防止路徑微偏移
    G90                       # 絕對座標模式

    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 偵測範圍中...歸位
        G28
    {% endif %}

    # 備份原本的加速度設定（用於階段五還原）
    {% set old_max_accel = printer.toolhead.max_accel %}

    # 讀取物理極限並定義安全中心 (手動整數化以避開浮點誤差)
    {% set cx = 57.5 | int %}
    {% set cy = 57.5 | int %}
    
    # 半徑 40mm：最右端 57.5+40=97.5mm，離 X115 極限有 17.5mm 絕對空間
    {% set r_limit = 40 %} 
    
    # 安全邊界設定 (不超過 110x110)
    {% set x_bound = 110 %} 
    {% set y_bound = 110 %} 
    {% set z_max = printer.toolhead.axis_maximum.z | float %}
    {% set z_safe = (z_max - 5) | int %}

    M118 啟動重組調整：中心 X{cx} Y{cy}，半徑 {r_limit}mm
    
    G1 X{cx} Y{cy} Z20 F6000
    M117 Kappy Extreme Battle! ⚡
    STOP_LED_EFFECTS
    SET_LED LED=TP_led RED=1 GREEN=1 BLUE=1 TRANSMIT=1
    G4 P1000

    # ----------------------------------------------------
    # 【2. 塗抹階段】
    # ----------------------------------------------------
    M118 階段一：極速十字星芒
    G90
    G1 X{cx} Y{cy} Z20 F6000
    {% for i in range(4) %}
        SET_LED LED=TP_led RED=1 GREEN=0 BLUE=0 TRANSMIT=1
        G1 X{cx + r_limit} Y{cy + r_limit} F8000
        G1 X{cx - r_limit} Y{cy - r_limit} F8000
        SET_LED LED=TP_led RED=0 GREEN=0 BLUE=1 TRANSMIT=1
        G1 X{cx} Y{cy} F6000
        G1 X{cx - r_limit} Y{cy + r_limit} F8000
        G1 X{cx + r_limit} Y{cy - r_limit} F8000
        SET_LED LED=TP_led RED=0 GREEN=1 BLUE=0 TRANSMIT=1
        G1 X{cx} Y{cy + r_limit} F8000
        G1 X{cx} Y{cy - r_limit} F8000
    {% endfor %}
    M400

    M118 階段二：全床 8 字交織
    G90
    G1 X{cx} Y{cy} Z30 F6000
    {% for i in range(12) %}
        SET_LED LED=TP_led RED=0.2 GREEN=0.8 BLUE=0.6 TRANSMIT=1
        G2 X{cx - 20} Y{cy} I-10 J0 F4500
        G2 X{cx} Y{cy} I10 J0 F4500
        G3 X{cx + 20} Y{cy} I10 J0 F4500
        G3 X{cx} Y{cy} I-10 J0 F4500
    {% endfor %}
    M400

    M118 階段三：深海極限呼吸
    G90
    G1 X20 Y20 Z10 F7000 
    {% for i in range(15) %}
        SET_LED LED=TP_led RED=0 GREEN=0 BLUE=0.8 TRANSMIT=1
        G1 Z{z_safe} F3500
        SET_LED LED=TP_led RED=0.8 GREEN=0 BLUE=0 TRANSMIT=1
        G1 Z10 F3600
        # 限制移動至 x_bound (110) 以內，並將計算數值四捨五入到小數點後兩位防錯
        {% set target_x = (20 + (i * (x_bound - 20) / 15.0)) | round(2) %}
        {% set target_y = (20 + (i * (y_bound - 20) / 15.0)) | round(2) %}
        G1 X{target_x} Y{target_y} F6000
    {% endfor %}
    M400

    M118 階段四：超維空間跳躍
    G90
    {% for i in range(12) %}
        SET_LED LED=TP_led RED=0 GREEN=1 BLUE=0 TRANSMIT=1
        G1 X15 Y15 Z15 F9000
        G1 X{x_bound} Y{y_bound} Z{z_safe - 10} F9000
        SET_LED LED=TP_led RED=1 GREEN=0.5 BLUE=0 TRANSMIT=1
        G1 X15 Y{y_bound} Z15 F9000
        G1 X{x_bound} Y15 Z{z_safe - 10} F9000
    {% endfor %}
    M400

    M118 階段五：火山高頻震盪
    G1 X{cx} Y{cy} Z30 F6000     # 震盪前先回到中心點與安全 Z 高度
    M400
    SET_VELOCITY_LIMIT ACCEL=7000 # 暫時提高加速度以激發高頻「抖動」效果
    G91 # 使用相對座標執行快速擺動
    SET_LED LED=TP_led RED=1 GREEN=0 BLUE=0 TRANSMIT=1 
    {% for i in range(70) %}
        G1 X3 Y3 Z0.5 F13000
        G1 X-6 Y-6 Z-1.0 F13000
        G1 X3 Y3 Z0.5 F13000
    {% endfor %}
    M400
    G90 # 切回絕對座標
    SET_VELOCITY_LIMIT ACCEL={old_max_accel} # 還原原本的加速度設定
    
    M118 震盪結束，執行安全重新歸位防護...
    G28 X Y # 強制重新校準 X Y 軸，消除高頻抖動可能產生的任何馬達丟步誤差
    M400

    # ----------------------------------------------------
    # 【3. 塗抹調整完成與重置】
    # ----------------------------------------------------
    M118 塗抹調整完成...
    G1 X{cx} Y{cy} Z40 F8000 
    
    {% for i in range(8) %}
        SET_LED LED=TP_led RED=1 GREEN=1 BLUE=1 TRANSMIT=1
        G4 P100
        SET_LED LED=TP_led RED=0 GREEN=0 BLUE=0 TRANSMIT=1
        G4 P100
    {% endfor %}

    BED_MESH_CLEAR
    # M84 # 如果您的 Z 軸馬達斷電不會導致熱床/噴頭下沉，可取消此行註解
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=rainbow REPLACE=1
    M117 Performance Success!

